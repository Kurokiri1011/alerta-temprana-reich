<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alerta Temprana · I.E. Reich La Perla</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f9;--card:#fff;--ink:#12324a;--mut:#5b7183;--line:#d9e4ea;--brand:#8c1d2c;--bi:#fff;--gold:#c9a24b;--navy:#24478f;--hd:#7a1626;--hi:#c2412d;--hb:#fbe9e5;--mid:#8a6200;--mb:#fff3d1;--ok:#2f7d4f;--ob:#e2f3e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a22;--card:#16262f;--ink:#e6eff4;--mut:#9bb0be;--line:#2a3f4b;--brand:#e5707d;--bi:#2a0a10;--navy:#8fb0ff;--hd:#5a0f1b;--hi:#ff8f7c;--hb:#3a1f1a;--mid:#f0c05a;--mb:#38300f;--ok:#74d199;--ob:#16301f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a22;--card:#16262f;--ink:#e6eff4;--mut:#9bb0be;--line:#2a3f4b;--brand:#e5707d;--bi:#2a0a10;--navy:#8fb0ff;--hd:#5a0f1b;--hi:#ff8f7c;--hb:#3a1f1a;--mid:#f0c05a;--mb:#38300f;--ok:#74d199;--ob:#16301f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Lexend,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.wrap,main,footer{max-width:940px;margin:0 auto}
h1{font-size:19px;margin:0;font-weight:700}h2{margin:0 0 6px;font-size:18px}h3{margin:0 0 10px;font-size:15px}
.sub{color:var(--mut);font-size:13px;margin:2px 0 8px}
.tag{font-size:12px;background:var(--mb);color:var(--mid);border-radius:6px;padding:1px 8px;margin-left:6px;font-weight:500}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{min-width:max-content;border:0;background:none;color:var(--mut);font:500 14px Lexend,system-ui,sans-serif;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-selected="true"]{color:var(--brand);border-color:var(--brand);font-weight:600}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
main{padding:16px}
footer{padding:0 16px 24px;color:var(--mut);font-size:12px}
.card,.st,.msg,.empty{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.st{border-left:6px solid var(--line)}.st.alta{border-left-color:var(--hi)}.st.media{border-left-color:var(--mid)}.st.estable{border-left-color:var(--ok)}
.empty{border-style:dashed;text-align:center;color:var(--mut);padding:24px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2>.card{margin:0}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.sum div{border-radius:12px;padding:10px;text-align:center;font-size:12px;background:var(--card);border:1px solid var(--line)}
.sum b{display:block;font-size:26px;line-height:1.1}
.s-hi{background:var(--hb)!important;color:var(--hi)}.s-mid{background:var(--mb)!important;color:var(--mid)}.s-ok{background:var(--ob)!important;color:var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile{border:2px solid var(--brand);border-radius:14px;padding:16px;background:var(--card);color:var(--brand);font:600 14px Lexend,system-ui,sans-serif;text-align:left;cursor:pointer}
.tile:first-child{background:var(--brand);color:var(--bi)}
.name{font-weight:600}.mut{color:var(--mut)}.sm{font-size:13px}
.badge{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;background:var(--bg);color:var(--mut)}
.alta .badge{background:var(--hb);color:var(--hi)}.media .badge{background:var(--mb);color:var(--mid)}.estable .badge{background:var(--ob);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--mut);border-radius:99px;padding:5px 11px;font:500 12px Lexend,system-ui,sans-serif}
.chip.on{background:var(--hb);color:var(--hi);border-color:var(--hi)}
button.chip{cursor:pointer;color:var(--ink);font-size:13px}button.chip[aria-pressed="true"]{background:var(--brand);color:var(--bi);border-color:var(--brand)}
.btn{background:var(--brand);color:var(--bi);border:0;border-radius:10px;padding:10px 16px;font:600 14px Lexend,system-ui,sans-serif;cursor:pointer;margin:2px 4px 2px 0}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.btn.dng{background:var(--hb);color:var(--hi)}
.btn:disabled{opacity:.55;cursor:default}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
label{font-size:13px;color:var(--mut);display:block}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--bg);color:var(--ink);font:400 14px Lexend,system-ui,sans-serif;margin-top:4px}
textarea{min-height:110px}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.bar span:first-child{width:46%}
.bar i{display:block;height:10px;border-radius:5px;background:var(--brand);min-width:3px}
.sp{width:110px;height:34px;color:var(--brand);display:block;margin:6px 0}
.ev{border-top:1px solid var(--line);padding:10px 0}.ev:first-of-type{border:0}
.ev .tg{font-size:11px;font-weight:600;background:var(--brand);color:var(--bi);border-radius:99px;padding:2px 9px}
.msg ul{padding-left:20px;margin:8px 0}.ok{color:var(--ok);font-size:13px;font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
@media (max-width:640px){.grid2,.tiles{grid-template-columns:1fr}.sum{grid-template-columns:1fr 1fr}}
header{background:var(--hd);border-bottom:3px solid var(--gold);color:#fff}
body::before{background:var(--hd)}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:6px}.hd img{width:54px;height:54px;border-radius:50%;background:#fff;padding:2px}
header .sub{color:#f1d9dc;margin:0}
nav button{color:#f1d9dc}nav button[aria-selected="true"]{color:#fff;border-color:var(--gold)}
.tag{background:var(--gold);color:#3a2300}
.bn{width:100%;display:block;border-radius:16px 16px 0 0}
.cap{background:var(--brand);color:var(--bi);padding:10px 14px;border-radius:0 0 16px 16px;font-weight:600;font-size:14px;margin-bottom:12px}
.fl{width:100%;display:block;border-radius:14px;border:1px solid var(--line)}
.card h3{color:var(--brand)}.sum div:first-child{border-top:4px solid var(--navy)}
.tile:nth-child(2){border-color:var(--navy);color:var(--navy)}.tile:nth-child(3){border-color:var(--gold);color:var(--mid)}
.bar i{background:linear-gradient(90deg,var(--brand),var(--gold))}.ev .tg{background:var(--navy)}
</style>
</head>

function vReg(){
var t='<div class="chips"><button class="chip" data-a="sub" data-s="est" aria-pressed="'+(sub=='est')+'">Estudiantes</button><button class="chip" data-a="sub" data-s="sem" aria-pressed="'+(sub=='sem')+'">Registro semanal</button></div>';
if(sub=='est')return t+'<form class="card" data-f="est"><h3>Nuevo estudiante</h3><div class="fg"><label>Nombre completo<input name="n" required></label><label>Grado y sección<input name="g" placeholder="3.° A" required></label><label>Apoderado<input name="ap"></label><label>Teléfono (opcional)<input name="tel" inputmode="tel"></label></div><button class="btn">Guardar estudiante</button></form>'+
'<div class="card"><h3>Estudiantes registrados ('+S.est.length+')</h3>'+(S.est.length?S.est.map(function(e){return '<div class="row ev"><div><span class="name">'+esc(e.n)+'</span><div class="mut sm">'+esc(e.g)+' · '+esc(e.ap||'Sin apoderado')+'</div></div><button class="btn sec dng" data-a="del" data-id="'+e.id+'">'+(armed==e.id?'¿Seguro? Toca otra vez':'Eliminar')+'</button></div>'}).join(''):'<p class="mut sm">Todavía no registras estudiantes.</p>')+'</div>';
if(!S.est.length)return t+'<div class="empty">Primero registra al menos un estudiante.</div>';
var R=S.reg.slice().sort(function(a,b){return a.f<b.f?1:-1}).slice(0,8);
return t+'<form class="card" data-f="reg"><h3>Datos de la semana</h3><div class="fg"><label>Estudiante<select name="e">'+estOpts(sel)+'</select></label><label>Fecha<input type="date" name="f" value="'+day(0)+'" required></label><label>Faltas<input type="number" name="fa" min="0" value="0" required></label><label>Tardanzas<input type="number" name="ta" min="0" value="0" required></label><label>Tareas pendientes<input type="number" name="tp" min="0" value="0" required></label><label>Promedio (0 a 20)<input type="number" name="nt" min="0" max="20" step="0.5" required></label><label>Participación (1 a 5)<input type="number" name="pa" min="1" max="5" value="3" required></label></div><label>Observación del docente<textarea name="ob" style="min-height:60px"></textarea></label><br><button class="btn">Guardar registro</button></form>'+
'<div class="card"><h3>Últimos registros</h3>'+(R.length?R.map(function(r){var e=S.est.filter(function(x){return x.id==r.e})[0];return '<div class="ev sm"><b>'+esc(e?e.n:'—')+'</b> · '+fd(r.f)+': faltas '+r.fa+', tardanzas '+r.ta+', tareas pend. '+r.tp+', promedio '+r.nt+', particip. '+r.pa+'/5</div>'}).join(''):'<p class="mut sm">Aún no hay registros semanales.</p>')+'</div>'}

function listDoc(){var A=all().filter(function(o){return(!flt.g||o.e.g==flt.g)&&(!flt.n||o.a.nv==flt.n)&&(!flt.q||o.e.n.toLowerCase().indexOf(flt.q.toLowerCase())>=0)});
if(!A.length)return '<div class="empty">No hay estudiantes con esos filtros.</div>';
return A.map(function(o){var e=o.e,a=o.a,l=a.l;return '<section class="st '+a.nv+'"><div class="row"><div><div class="name">'+esc(e.n)+'</div><div class="mut sm">'+esc(e.g)+' · Apoderado: '+esc(e.ap||'—')+'</div></div><span class="badge">'+LAB[a.nv]+'</span></div>'+
(l?'<div class="chips">'+K.map(function(k){return '<span class="chip'+(a.s[k]?' on':'')+'">'+SIG[k]+'</span>'}).join('')+'</div><p class="mut sm">Último registro ('+fd(l.f)+'): faltas '+l.fa+', tardanzas '+l.ta+', tareas pendientes '+l.tp+', promedio '+l.nt+', participación '+l.pa+'/5'+(l.ob?'. Observación: '+esc(l.ob):'')+'</p>'+spark(e.id):'<p class="mut sm">Aún no tiene registros semanales.</p>')+
'<button class="btn sec" data-a="reg" data-id="'+e.id+'">Registrar semana</button></section>'}).join('')}
function vDoc(){if(!S.est.length)return none();var gs=[];S.est.forEach(function(e){if(gs.indexOf(e.g)<0)gs.push(e.g)});
return '<p class="mut sm">El nivel de alerta se calcula solo con el último registro semanal y los criterios de Datos.</p><div class="fg"><label>Buscar<input id="q" value="'+esc(flt.q)+'" placeholder="Nombre del estudiante"></label><label>Grado<select data-a="flt" data-k="g"><option value="">Todos</option>'+opts(gs,flt.g)+'</select></label><label>Nivel<select data-a="flt" data-k="n"><option value="">Todos</option>'+['alta','media','estable','sin'].map(function(x){return '<option value="'+x+'"'+(flt.n==x?' selected':'')+'>'+LAB[x]+'</option>'}).join('')+'</select></label></div><div id="lista">'+listDoc()+'</div>'}

function vCom(){var A=all().filter(function(o){return o.a.nv=='alta'||o.a.nv=='media'}).sort(function(x,y){return y.a.c-x.a.c});
if(!S.est.length)return none();
var r=S.ev.filter(function(x){return x.tipo=='Reunión de comité'&&x.f>=day(0)}).sort(function(a,b){return a.f<b.f?-1:1})[0];
var h='<div class="card"><h3>Próxima reunión del comité</h3>'+(r?evHtml(r):'<p class="mut sm">Sin reunión programada. Agéndala en Talleres.</p>')+'</div>';
if(!A.length)return h+'<div class="empty">No hay casos para revisar. Cuando el registro semanal marque señales, aparecerán aquí.</div>';
return h+A.map(function(o){var e=o.e,a=o.a,c=S.cas[e.id]||{},d='data-a="cas" data-id="'+e.id+'" ';
return '<section class="st '+a.nv+'"><div class="row"><div><div class="name">'+esc(e.n)+' <span class="mut sm">· '+esc(e.g)+'</span></div><div class="mut sm">Señales: '+sigs(a).join(', ')+'</div></div><span class="badge">'+LAB[a.nv]+'</span></div>'+
'<div class="fg" style="margin-top:10px"><label>Acción acordada<select '+d+'data-k="acc"><option value="">Elegir…</option>'+opts(ACC,c.acc)+'</select></label><label>Responsable<input '+d+'data-k="resp" value="'+esc(c.resp)+'"></label><label>Estado<select '+d+'data-k="est">'+opts(['Pendiente','En seguimiento','Cerrado'],c.est||'Pendiente')+'</select></label></div>'+
'<button class="btn" data-a="av" data-id="'+e.id+'"'+(!c.acc||c.av?' disabled':'')+'>'+(c.av?'Aviso enviado':'Avisar a la familia')+'</button>'+(!c.acc?'<span class="mut sm">Elige una acción para avisar.</span>':'')+'</section>'}).join('')}

function vFam(){if(!S.est.length)return none();
if(!S.est.some(function(e){return e.id==fam}))fam=S.est[0].id;
var e=S.est.filter(function(x){return x.id==fam})[0],a=ana(e),c=S.cas[e.id]||{},nm=esc(e.n.split(' ')[0]),m;
if(a.nv=='sin')m='<div class="empty">Aún no hay registros para este estudiante.</div>';
else if(a.nv=='estable')m='<div class="msg"><h2>¡Buenas noticias!</h2><p>'+nm+' va bien en este momento. Seguir conversando en casa sobre su día ayuda a mantenerlo así.</p></div>';
else if(!c.av)m='<div class="empty">Todavía no hay un aviso para esta familia. Aparecerá aquí cuando el comité lo envíe.</div>';

function evHtml(x){return '<div class="ev"><span class="tg">'+esc(x.tipo)+'</span> <b>'+esc(x.t)+'</b><div class="mut sm">'+fd(x.f)+(x.h?' · '+esc(x.h):'')+(x.lug?' · '+esc(x.lug):'')+'</div>'+(x.d?'<div class="sm">'+esc(x.d)+'</div>':'')+'</div>'}
function vTal(){var hoy=day(0),L=S.ev.filter(function(x){return!flt.t||x.tipo==flt.t}).sort(function(a,b){return a.f<b.f?-1:1}),p=L.filter(function(x){return x.f>=hoy}),a=L.filter(function(x){return x.f<hoy}).reverse();
var card=function(x){return '<div class="card" style="margin:0">'+evHtml(x)+'<button class="btn sec dng" data-a="dev" data-id="'+x.id+'">'+(armed==x.id?'¿Seguro?':'Eliminar')+'</button></div>'};
return '<form class="card" data-f="ev"><h3>Publicar actividad</h3><div class="fg"><label>Título<input name="t" required></label><label>Tipo<select name="tipo">'+opts(TIPOS)+'</select></label><label>Fecha<input type="date" name="f" value="'+hoy+'" required></label><label>Hora<input type="time" name="h"></label><label>Lugar o enlace<input name="lug"></label></div><label>Descripción<textarea name="d" style="min-height:60px"></textarea></label><br><button class="btn">Publicar</button></form>'+
'<div class="chips"><button class="chip" data-a="ft" data-t="" aria-pressed="'+(!flt.t)+'">Todas</button>'+TIPOS.map(function(t){return '<button class="chip" data-a="ft" data-t="'+t+'" aria-pressed="'+(flt.t==t)+'">'+t+'</button>'}).join('')+'</div>'+
'<h3>Próximas</h3>'+(p.length?'<div class="grid2">'+p.map(card).join('')+'</div>':'<div class="empty">No hay actividades próximas.</div>')+'<h3 style="margin-top:16px">Anteriores</h3>'+(a.length?'<div class="grid2">'+a.map(card).join('')+'</div>':'<p class="mut sm">Sin actividades anteriores.</p>')}

function vDat(){var c=S.cfg;return '<form class="card" data-f="cfg"><h3>Criterios de alerta</h3><p class="mut sm">Una señal se activa cuando el último registro cumple el criterio. Con 2 señales hay seguimiento y con 3 o más, atención alta.</p><div class="fg"><label>Faltas + tardanzas desde<input type="number" name="fa" min="1" value="'+c.fa+'"></label><label>Tareas pendientes desde<input type="number" name="tp" min="1" value="'+c.tp+'"></label><label>Promedio menor a<input type="number" name="nt" min="1" max="20" value="'+c.nt+'"></label><label>Participación hasta<input type="number" name="pa" min="1" max="5" value="'+c.pa+'"></label></div><button class="btn">Guardar criterios</button></form>'+
'<div class="card"><h3>Copia de seguridad</h3><p class="mut sm">Genera la copia, guárdala en un lugar seguro y pégala aquí para restaurarla en otro dispositivo.</p><textarea id="bk" aria-label="Copia de seguridad"></textarea><br><button class="btn sec" data-a="bk">Generar copia</button><button class="btn" data-a="imp">Importar desde el cuadro</button></div>'+
'<div class="card"><h3>Datos del prototipo</h3><button class="btn sec" data-a="demo">Cargar datos de ejemplo</button><button class="btn dng" data-a="rst">'+(armed=='rst'?'¿Seguro? Se borra todo':'Borrar todos los datos')+'</button></div>'}

function demo(){var n=['Camila Quispe','Diego Mamani','Valeria Condori','Mateo Huamán','Luciana Flores','Sebastián Ccori'],g=['3.° A','3.° A','2.° B','2.° B','4.° C','4.° C'];
var P=[[[1,0,1,14,3],[1,1,2,12,2],[2,1,3,10,2]],[[0,0,0,15,4],[0,1,1,14,3],[1,1,2,13,2]],[[0,0,0,17,5],[0,0,0,17,4],[0,0,0,18,5]],[[1,1,1,13,3],[2,1,2,11,2],[2,2,3,9,1]],[[0,0,1,16,4],[0,0,1,15,4],[0,1,2,14,3]],[[1,1,1,15,4],[1,1,1,14,3],[1,2,2,11,2]]];
S.est=n.map(function(x,i){return{id:'d'+i,n:x,g:g[i],ap:'Familia de '+x.split(' ')[0],tel:''}});S.reg=[];S.cas={};
P.forEach(function(w,i){w.forEach(function(r,j){S.reg.push({id:'r'+i+j,e:'d'+i,f:day((2-j)*7),fa:r[0],ta:r[1],tp:r[2],nt:r[3],pa:r[4],ob:''})})});
S.ev=[{id:'v1',t:'Reunión semanal de casos',tipo:'Reunión de comité',f:day(-2),h:'15:00',lug:'Sala de docentes',d:'Revisión de los casos con señales de alerta.'},{id:'v2',t:'Taller de hábitos de estudio',tipo:'Taller',f:day(-4),h:'16:00',lug:'Aula 3',d:'Organización del tiempo y autorregulación.'},{id:'v3',t:'Escuela de familias: cómo acompañar en casa',tipo:'Escuela de familias',f:day(-8),h:'18:00',lug:'Auditorio',d:'Pautas para apoyar tareas y rutinas.'}]}

function render(){$('#tabs').innerHTML=VIEWS.map(function(v){return '<button role="tab" aria-selected="'+(view==v[0])+'" data-a="go" data-v="'+v[0]+'">'+v[1]+'</button>'}).join('');
$('#app').innerHTML={inicio:vInicio,registro:vReg,docente:vDoc,comite:vCom,familia:vFam,talleres:vTal,datos:vDat}[view]()}
var app=$('#app');
app.addEventListener('submit',function(ev){ev.preventDefault();var f=ev.target,d={},t=f.dataset.f,m;new FormData(f).forEach(function(v,k){d[k]=String(v).trim()});
if(t=='est'){S.est.push({id:uid(),n:d.n,g:d.g,ap:d.ap,tel:d.tel});m='Estudiante guardado.'}
else if(t=='reg'){S.reg.push({id:uid(),e:d.e,f:d.f,fa:+d.fa,ta:+d.ta,tp:+d.tp,nt:+d.nt,pa:+d.pa,ob:d.ob});sel=d.e;m='Registro guardado. Las alertas se actualizaron.'}
else if(t=='ev'){S.ev.push({id:uid(),t:d.t,tipo:d.tipo,f:d.f,h:d.h,lug:d.lug,d:d.d});m='Actividad publicada.'}
else if(t=='cfg'){S.cfg={fa:+d.fa,tp:+d.tp,nt:+d.nt,pa:+d.pa};m='Criterios actualizados.'}
save();render();toast(m)});
document.addEventListener('click',function(ev){var b=ev.target.closest('button[data-a]');if(!b)return;var a=b.dataset.a,id=b.dataset.id,m;
if(a=='go'){view=b.dataset.v;armed='';render();window.scrollTo(0,0);return}
if(a=='sub')sub=b.dataset.s;
else if(a=='demo'){demo();save();m='Datos de ejemplo cargados.'}
else if(a=='del'||a=='dev'||a=='rst'){var k=a=='rst'?'rst':id;if(armed!=k){armed=k;render();return}armed='';
 if(a=='del'){S.est=S.est.filter(function(e){return e.id!=id});S.reg=S.reg.filter(function(r){return r.e!=id});delete S.cas[id]}
 else if(a=='dev')S.ev=S.ev.filter(function(x){return x.id!=id});
 else S={est:[],reg:[],cas:{},ev:[],cfg:S.cfg};save();m='Eliminado.'}
else if(a=='av'){(S.cas[id]=S.cas[id]||{}).av=1;save();m='Aviso enviado a la familia.'}
else if(a=='leido'){(S.cas[id]=S.cas[id]||{}).leido=1;save()}
else if(a=='reg'){sel=id;sub='sem';view='registro';window.scrollTo(0,0)}
else if(a=='ft')flt.t=b.dataset.t;
else if(a=='bk'){$('#bk').value=JSON.stringify(S);return}
else if(a=='imp'){try{var x=JSON.parse($('#bk').value);if(!x||!Array.isArray(x.est)||!Array.isArray(x.reg))throw 0;S={est:x.est,reg:x.reg,cas:x.cas||{},ev:x.ev||[],cfg:x.cfg||S.cfg};save();m='Copia restaurada.'}catch(e){toast('La copia no es válida.');return}}
render();if(m)toast(m)});
app.addEventListener('change',function(ev){var t=ev.target,a=t.dataset.a;if(!a)return;
if(a=='cas'){var c=S.cas[t.dataset.id]=S.cas[t.dataset.id]||{};c[t.dataset.k]=t.value;save();if(t.dataset.k=='resp')return}
else if(a=='fam')fam=t.value;
else if(a=='flt')flt[t.dataset.k]=t.value;
render()});
app.addEventListener('input',function(ev){var t=ev.target;if(t.dataset.k=='resp'){(S.cas[t.dataset.id]=S.cas[t.dataset.id]||{}).resp=t.value;save()}if(ev.target.id=='q'){flt.q=ev.target.value;$('#lista').innerHTML=listDoc()}});
render();
</script>
